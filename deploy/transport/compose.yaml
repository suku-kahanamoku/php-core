services:
  otp:
    image: opentripplanner/opentripplanner:2.9.0
    command: ["--load", "--serve"]
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OTP_HEAP:-4G}"
    ports:
      - "127.0.0.1:${OTP_PORT:-8080}:8080"
    volumes:
      - "${OTP_GRAPH_DIR:?Set immutable OTP_GRAPH_DIR}:/var/opentripplanner:ro"
    restart: unless-stopped
